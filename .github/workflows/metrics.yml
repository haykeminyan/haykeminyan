name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"    # once a day
  workflow_dispatch:        # allows manual run from the Actions tab
  push:
    branches: [ main ]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: haykeminyan
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Lisbon

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_colors: github

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_stars: yes
          plugin_stars_limit: 4

          extras_css: |
            html, body {
              background: #05050a !important;
            }
            * {
              font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace !important;
            }
            h1, h2, h3, h4 {
              color: #3ddc84 !important;
              text-shadow: 0 0 3px rgba(61,220,132,0.55) !important;
            }
            a, a:link, a:visited {
              color: #8ff0b8 !important;
              text-shadow: none !important;
            }
            body, p, span, div, li, td, th {
              color: #7fcda3 !important;
            }
            strong, b {
              color: #baf7d5 !important;
            }
            hr {
              border-color: rgba(61,220,132,0.25) !important;
            }
            svg {
              background: transparent !important;
            }